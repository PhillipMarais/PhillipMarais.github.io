<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phillip Marais · Front-end-focused full-stack developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Phillip Marais, front-end-focused full-stack developer working with Angular, TypeScript and .NET. Somerset West, South Africa."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)" />
    <!--
      Before first paint: mark that JavaScript is running (so JS-only layouts like the projects
      carousel apply straight away, with no jump when their code loads), and apply a saved theme.
    -->
    <script>
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
